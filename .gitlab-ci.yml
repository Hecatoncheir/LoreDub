stages:
  - verify
  - package

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

verify:
  stage: verify
  image: ghcr.io/cirruslabs/flutter:stable
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential clang
  script:
    - flutter pub get
    - dart run tool/ffigen.dart
    - dart format --output=none --set-exit-if-changed lib test tool hook
    - flutter analyze --fatal-infos
    - flutter test
  cache:
    key: pub-cache
    paths:
      - .pub-cache/

windows-setup:
  stage: package
  tags:
    - windows
  needs:
    - verify
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_setup.ps1
  artifacts:
    name: "lore-dub-$CI_COMMIT_REF_SLUG-windows-x64"
    expire_in: 14 days
    paths:
      - dist/*.exe
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
