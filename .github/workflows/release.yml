name: Windows release

on:
  push:
    tags:
      # A version and nothing else: the models repository's tags such as
      # voices-vosk-v1 start with a v too, and started a release of the app.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache bundled inference runtime
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/LoreDubBuildCache
          # The suffix is turned over when a cache already saved cannot be
          # trusted: -v1 was kept by a script that did not notice pip failing.
          key: loredub-runtime-whisper-1.8.2-python-3.11.9-torch-2.7.1-v2
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Validate version against pubspec.yaml and CHANGELOG.md
        shell: pwsh
        run: dart run tool/prepare_release.dart --tag $env:GITHUB_REF_NAME --output dist/release-notes.md
      - name: Build Windows setup
        shell: pwsh
        run: ./scripts/build_setup.ps1 -ReleaseTag $env:GITHUB_REF_NAME
      - name: Prepare release notes with the setup's SHA-256
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem "dist/*.exe")
          if ($setup.Count -ne 1) { throw "Expected exactly one setup executable, found $($setup.Count)." }
          dart run tool/prepare_release.dart --tag $env:GITHUB_REF_NAME --output dist/release-notes.md --installer $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: LoreDub-${{ github.ref_name }}-windows-x64-setup
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $assets = @(Get-ChildItem "dist/*.exe")
          if ($assets.Count -ne 1) {
            throw "Expected exactly one setup executable, found $($assets.Count)."
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "LoreDub $version" --notes-file dist/release-notes.md
            gh release upload $tag $assets[0].FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $assets[0].FullName --repo $env:GITHUB_REPOSITORY --verify-tag --title "LoreDub $version" --notes-file dist/release-notes.md
          }
