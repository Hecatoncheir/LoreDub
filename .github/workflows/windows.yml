name: Windows build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/ffigen.dart
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build windows --release
