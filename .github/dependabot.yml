# Weekly pull requests for the Dart packages and the workflows' actions.
# Flutter itself is pinned in windows.yml by hand, since the goldens are one
# engine's drawing, and is not Dependabot's to move.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
