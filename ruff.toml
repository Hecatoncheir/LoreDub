# The worker and the scripts beside it (`ruff check`, a CI step). The
# defaults -- pyflakes and the errors pycodestyle is sure of -- with the
# imports kept in order and bugbear's likely bugs on top.

line-length = 100
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[lint.isort]
# The worker imports its own modules by name from the directory it runs in.
known-first-party = ["audio", "dubbing_text", "english_g2p", "kokoro_voice", "onnx_speech",
                     "protocol", "tone_converter", "voices", "vosk_voice", "inference_worker"]
